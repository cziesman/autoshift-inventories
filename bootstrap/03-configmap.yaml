apiVersion: v1
kind: ConfigMap
metadata:
  name: autoshift-bootstrap
  namespace: openshift-gitops
data:
  bootstrap.sh: |
    #!/bin/bash
    set -euo pipefail

    cat <<EOF | oc apply -f -
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: autoshift
      namespace: openshift-gitops
    spec:
      project: default
    
      sources:
        # Site-specific values
        - repoURL: https://github.com/cziesman/autoshift-inventories.git
          targetRevision: main
          ref: siteValues
    
        # AutoShift mirror, using the custom policy branch
        - repoURL: https://github.com/cziesman/autoshiftv2.git
          targetRevision: custom-policy
          path: autoshift
          helm:
            valueFiles:
              - $siteValues/global.yaml
              - $siteValues/clustersets/hub.yaml
              - $siteValues/clustersets/managed.yaml
    
            parameters:
              - name: autoshiftGitRepo
                value: $ARGOCD_APP_SOURCE_REPO_URL
              - name: autoshiftGitBranchTag
                value: $ARGOCD_APP_SOURCE_TARGET_REVISION
    
      destination:
        server: https://kubernetes.default.svc
        namespace: openshift-gitops
    
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
    EOF
