apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autoshift-bootstrap
  namespace: openshift-gitops
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
